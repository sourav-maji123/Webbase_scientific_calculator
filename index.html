<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scientific Calculator - Sourav</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#000);
  background-size:400% 400%;
  animation:bg 10s ease infinite;
}

@keyframes bg{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

.calc{
  width:380px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  padding:20px;
  border-radius:20px;
  box-shadow:0 0 30px rgba(0,245,255,0.4);
}

.display{
  background:#000;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
  color:#00f5ff;
  text-align:right;
}

#history{
  font-size:14px;
  opacity:0.6;
}

#result{
  font-size:28px;
  word-wrap:break-word;
}

.keys{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

button{
  padding:12px;
  border:none;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
  background:rgba(255,255,255,0.1);
  color:white;
  transition:0.3s;
}

button:hover{
  background:#00f5ff;
  color:black;
}

.key-eq{
  background:#00f5ff;
  color:black;
}

.key-eq:hover{
  background:white;
}
</style>
</head>

<body>

<div class="calc">
  <div class="display">
    <div id="history"></div>
    <div id="result">0</div>
  </div>

  <div class="keys">
    <button onclick="insert('Math.sin(')">sin</button>
    <button onclick="insert('Math.cos(')">cos</button>
    <button onclick="insert('Math.tan(')">tan</button>
    <button onclick="insert('Math.log10(')">log</button>
    <button onclick="insert('Math.log(')">ln</button>

    <button onclick="insert('Math.sqrt(')">√</button>
    <button onclick="insert('Math.PI')">π</button>
    <button onclick="insert('Math.E')">e</button>
    <button onclick="insert('**')">x^y</button>
    <button onclick="factorial()">x!</button>

    <button onclick="clearAll()">AC</button>
    <button onclick="deleteLast()">DEL</button>
    <button class="key-eq" onclick="calculate()">=</button>
    <button onclick="insert('/')">÷</button>
    <button onclick="insert('*')">×</button>

    <button onclick="insert('7')">7</button>
    <button onclick="insert('8')">8</button>
    <button onclick="insert('9')">9</button>
    <button onclick="insert('-')">−</button>
    <button onclick="insert('+')">+</button>

    <button onclick="insert('4')">4</button>
    <button onclick="insert('5')">5</button>
    <button onclick="insert('6')">6</button>
    <button onclick="insert('(')">(</button>
    <button onclick="insert(')')">)</button>

    <button onclick="insert('1')">1</button>
    <button onclick="insert('2')">2</button>
    <button onclick="insert('3')">3</button>
    <button onclick="insert('0')">0</button>
    <button onclick="insert('.')">.</button>
  </div>
</div>

<script>
let expression = "";

function insert(value){
  expression += value;
  document.getElementById("result").innerText = expression;
}

function clearAll(){
  expression = "";
  document.getElementById("result").innerText = "0";
  document.getElementById("history").innerText = "";
}

function deleteLast(){
  expression = expression.slice(0,-1);
  document.getElementById("result").innerText = expression || "0";
}

function calculate(){
  try{
    document.getElementById("history").innerText = expression;
    let result = eval(expression);
    document.getElementById("result").innerText = result;
    expression = result.toString();
  }catch{
    document.getElementById("result").innerText = "Error";
    expression = "";
  }
}

function factorial(){
  try{
    let num = eval(expression);
    if(num < 0) return;
    let fact = 1;
    for(let i=1;i<=num;i++){
      fact *= i;
    }
    document.getElementById("history").innerText = num + "!";
    document.getElementById("result").innerText = fact;
    expression = fact.toString();
  }catch{
    document.getElementById("result").innerText = "Error";
  }
}
</script>

</body>
</html>
