<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scientific Calculator</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f1115;
      font-family: Arial, sans-serif;
      color: #fff;
    }
    .calc {
      width: 420px;
      background: #1b2230;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,.5);
    }
    .screen {
      padding: 20px;
      background: #121722;
    }
    .display {
      background: #0f141c;
      border-radius: 12px;
      padding: 15px;
      text-align: right;
    }
    .display #history {
      font-size: 14px;
      color: #aaa;
    }
    .display #result {
      font-size: 28px;
      font-weight: bold;
    }
    .keys {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 15px;
    }
    button {
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #273043;
      color: #fff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.1), 0 3px 6px rgba(0,0,0,.4);
    }
    button:active {
      transform: scale(0.96);
    }
    .key-ac { background: #ef4444; color: #fff; }
    .key-del { background: #f59e0b; color: #fff; }
    .key-ops { background: #334155; }
    .key-fn { background: #2a354a; }
    .key-eq {
      background: #22c55e;
      color: #000;
    }
  </style>
</head>
<body>
  <div class="calc">
    <div class="screen">
      <div class="display">
        <div id="history"></div>
        <div id="result">0</div>
      </div>
    </div>
    <div class="keys">
      <button class="key-fn" data-insert="sin(">sin</button>
      <button class="key-fn" data-insert="cos(">cos</button>
      <button class="key-fn" data-insert="tan(">tan</button>
      <button class="key-fn" data-insert="log(">log</button>
      <button class="key-fn" data-insert="ln(">ln</button>

      <button class="key-fn" data-insert="√(">√</button>
      <button class="key-fn" data-insert="π">π</button>
      <button class="key-fn" data-insert="ℯ">e</button>
      <button class="key-fn" data-insert="^">x^y</button>
      <button class="key-fn" data-insert="!">x!</button>

      <button class="key-ac" data-action="ac">AC</button>
      <button class="key-del" data-action="del">DEL</button>
      <button class="key-eq" data-action="equals">=</button>
      <button class="key-ops" data-insert="÷">÷</button>
      <button class="key-ops" data-insert="×">×</button>

      <button data-insert="7">7</button>
      <button data-insert="8">8</button>
      <button data-insert="9">9</button>
      <button class="key-ops" data-insert="-">−</button>
      <button class="key-ops" data-insert="+">+</button>

      <button data-insert="4">4</button>
      <button data-insert="5">5</button>
      <button data-insert="6">6</button>
      <button data-insert="(">(</button>
      <button data-insert=")">)</button>

      <button data-insert="1">1</button>
      <button data-insert="2">2</button>
      <button data-insert="3">3</button>
      <button data-insert="0">0</button>
      <button data-insert=".">.</button>
    </div>
  </div>

  <script>
    const resultEl = document.getElementById('result');
    const histEl = document.getElementById('history');
    let expr = '';

    function updateDisplay() {
      resultEl.textContent = expr || '0';
    }

    function insert(token) {
      expr += token;
      updateDisplay();
    }

    function clearAll() {
      expr = '';
      updateDisplay();
    }

    function backspace() {
      expr = expr.slice(0, -1);
      updateDisplay();
    }

    function factorial(n){
      if(n < 0) return NaN;
      if(n === 0) return 1;
      return n * factorial(n-1);
    }

    function evaluateExpression(s) {
      try {
        let replaced = s.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
                        .replace(/π/g, 'Math.PI').replace(/ℯ/g, 'Math.E')
                        .replace(/√\(/g, 'Math.sqrt(')
                        .replace(/sin\(/g, 'Math.sin(')
                        .replace(/cos\(/g, 'Math.cos(')
                        .replace(/tan\(/g, 'Math.tan(')
                        .replace(/log\(/g, 'Math.log10(')
                        .replace(/ln\(/g, 'Math.log(')
                        .replace(/\^/g, '**');
        // factorial handling
        replaced = replaced.replace(/(\d+)!/g, (m, n) => factorial(parseInt(n)));
        let val = Function('return ' + replaced)();
        return val;
      } catch {
        return 'Error';
      }
    }

    document.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const insertVal = btn.dataset.insert;
        if (insertVal !== undefined) {
          insert(insertVal);
        } else if (action === 'ac') {
          clearAll();
        } else if (action === 'del') {
          backspace();
        } else if (action === 'equals') {
          let res = evaluateExpression(expr);
          histEl.textContent = expr + ' =';
          resultEl.textContent = res;
          expr = '';
        }
      });
    });
  </script>
</body>
</html>
